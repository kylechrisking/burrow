# burrow config. Every key is optional — delete what you do not need.
# Mount as /config/burrow.toml.

title = "HomeLab"
theme = "midnight"          # midnight | daylight | ember | forest | any file in web/themes/
search = ""                 # "google" | "duckduckgo" | "bing": Enter in the filter box searches the web
categories = []             # display order, e.g. ["Media", "Downloads", "Network"]

# Proxmox: nodes, guests, storage, and the guest IPs that drive fingerprinting.
# Token needs only PVEAuditor; see README.
[proxmox]
url = "https://192.168.1.10:8006"
token_file = "/secrets/proxmox.token"   # one line: root@pam!burrow=xxxxxxxx-....
# TLS is not verified (Proxmox ships a self-signed cert).
# VMs without the QEMU guest agent or a static ipconfig: tell it their IP.
# guest_addresses = { 105 = "192.168.1.105" }

# Docker: the local socket is picked up automatically when mounted.
# Remote engines: put tecnativa/docker-socket-proxy (CONTAINERS=1 INFO=1) in front.
[docker]
endpoints = ["unix:///var/run/docker.sock"]
# Where the local engine's published ports are reachable, if it is not a Proxmox
# guest whose name matches the Docker hostname:
# addresses = { "unix:///var/run/docker.sock" = "192.168.1.20" }

# Extra hosts to fingerprint (a NAS, a Pi, anything outside Proxmox/Docker).
[scan]
hosts = []

[secrets]
file = "/secrets/apps.toml"

[hide]
apps = []                   # app ids, e.g. ["flaresolverr"]
names = []                  # card names

# Header weather from open-meteo (no API key).
# [weather]
# label = "Nashville"
# latitude = 36.16
# longitude = -86.78
# units = "imperial"

# Manual cards for things that cannot be discovered. `check` decides up/down
# (defaults to url; false for a plain link).
# [[service]]
# name = "Router"
# url = "https://192.168.1.1"
# check = false
# category = "Network"
# icon = "ubiquiti"
# description = "UniFi gateway"

# A card fed by any JSON URL. fields = [[key or "{template}", label], ...]
# [[card]]
# name = "Spotify"
# category = "Overview"
# url = "https://open.spotify.com"
# data = "http://192.168.1.20:8000/spotify"
# fields = [["track", "Track"], ["artist", "Artist"], ["{volume}%", "Volume"]]
# refresh = 30

# Rename, describe, re-link or hide anything discovered.
# Keys: app id ("sonarr"), "app@host" ("pihole@pihole2"), or the card's name.
# [override.sonarr]
# description = "TV"
# [override."pihole@pihole2"]
# name = "Pi-hole 2"

# Friendly links: "ip:port" of a discovered service -> URL on its card.
# [links]
# "192.168.1.20:8989" = "http://sonarr.lan"

# [[bookmark]]
# group = "Admin"
# name = "Router"
# abbr = "GW"
# url = "https://192.168.1.1"

# Your own panels: put custom.css / custom.js next to this file. Burrow serves
# them and gives custom.js an empty <div id="panels"> it never re-renders, plus a
# "burrow:render" event (detail = the state) after every refresh.
