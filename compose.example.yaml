services:
  burrow:
    build: .
    # image: ghcr.io/kylechrisking/burrow:latest   # once published
    container_name: burrow
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # optional: local Docker discovery
      - ./config:/config:ro                            # optional: burrow.toml
      - ./secrets:/secrets:ro                          # optional: proxmox.token, apps.toml (chmod 600)
