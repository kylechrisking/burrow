services:
  burrow:
    image: ghcr.io/kylechrisking/burrow:latest
    # build: .        # or build from a clone of the repo
    container_name: burrow
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # this host's containers (optional)
      - ./config:/config:ro                            # burrow.toml, custom.css/js, icons/ (optional)
      - ./secrets:/secrets:ro                          # proxmox.token, apps.toml (optional)
