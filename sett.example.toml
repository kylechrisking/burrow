# sett config. Every key is optional — delete what you do not need.
# Mount as /config/sett.toml.

title = "HomeLab"
theme = "midnight"          # midnight | daylight | ember | forest | any file in web/themes/
search = ""                 # "google" | "duckduckgo" | "bing": Enter in the filter box searches the web
categories = []             # display order, e.g. ["Media", "Downloads", "Network"]

# Proxmox: nodes, guests, storage, and the guest IPs that drive fingerprinting.
# Token needs only PVEAuditor; see README.
[proxmox]
url = "https://192.168.1.10:8006"
token_file = "/secrets/proxmox.token"   # one line: root@pam!sett=xxxxxxxx-....
# TLS is not verified (Proxmox ships a self-signed cert).
# VMs without the QEMU guest agent or a static ipconfig: tell it their IP.
# guest_addresses = { 105 = "192.168.1.105" }

# Docker: the local socket is picked up automatically when mounted.
# Remote engines: put tecnativa/docker-socket-proxy (CONTAINERS=1 INFO=1) in front.
[docker]
endpoints = ["unix:///var/run/docker.sock"]
# Where the local engine's published ports are reachable, if it is not a Proxmox
# guest whose name matches the Docker hostname:
# addresses = { "unix:///var/run/docker.sock" = "192.168.1.20" }

# Extra hosts to fingerprint (a NAS, a Pi, anything outside Proxmox/Docker).
# A subnet ("192.168.1.0/24") is swept and every address that answers is added.
[scan]
hosts = []

[secrets]
file = "/secrets/apps.toml"

[hide]
apps = []                   # app ids, e.g. ["flaresolverr"]
names = []                  # card names
hosts = []                  # host names or IPs; or tag a Proxmox guest "sett-hide"

# Edits to this file apply within a few seconds, no restart. A broken edit is
# ignored (the page says why) and the last good config keeps running.

# Look and feel, on top of the theme. Everything is optional.
# [ui]
# accent = "#38bdf8"          # main accent colour
# accent_2 = "#a78bfa"        # second colour of the gradients
# wallpaper = "https://example.com/bg.jpg"
# density = "compact"         # tighter cards, good on phones
# clock = "24h"
# auto_dark = "midnight"      # what theme "auto" uses in dark mode...
# auto_light = "daylight"     # ...and in light mode
# all_tab = true              # add an "All" tab in front of your views

# Views: named pages from one config, shown as tabs. Open one directly with
# ?view=<name>, e.g. home.lan/?view=family. Every key is optional.
# [[view]]
# name = "Family"
# categories = ["Shared"]                       # which service groups
# sections = ["services", "links"]              # panels, summary, services, cluster, hosts, links
# links = ["Kids"]                              # which bookmark groups

# Header weather from open-meteo (no API key).
# [weather]
# label = "Nashville"
# latitude = 36.16
# longitude = -86.78
# units = "imperial"

# Manual cards for things that cannot be discovered. `check` decides up/down
# (defaults to url; false for a plain link).
# [[service]]
# name = "Router"
# url = "https://192.168.1.1"
# check = false
# category = "Network"
# icon = "ubiquiti"
# description = "UniFi gateway"

# A card fed by any JSON URL. fields = [[key or "{template}", label, rule?], ...]
# A rule colours the value (see "Thresholds" below).
# [[card]]
# name = "Storage"
# category = "Overview"
# url = "http://nas.lan"
# data = "http://192.168.1.20:8800/disk.json"
# fields = [["{free_gb:,} GB", "Free", { warn_below = 1500, bad_below = 500 }], ["state", "Guard", { ok_if = "ok", otherwise = "warn" }]]
# refresh = 60

# Rename, describe, re-link, re-icon or hide anything discovered, and shape its stats.
# Keys: app id ("sonarr"), "app@host" ("pihole@pihole2"), or the card's name.
# [override.sonarr]
# description = "TV"
# icon = "mdi-television"              # dashboard-icons name, mdi-*, or a URL
# rename = { Queue = "Downloading" }
# stats = ["Downloading", "Missing"]   # which stats, in this order
# tones = { Missing = { warn_above = 0 } }
# [override."pihole@pihole2"]
# name = "Pi-hole 2"
#
# Thresholds: warn_above / bad_above / warn_below / bad_below compare the number
# shown ("3,327 GB" is 3327). ok_if / warn_if / bad_if match the text (a value or
# a list); otherwise = tone when no text rule matched. The worst tone wins.
#
# Icons: put your own files in an icons/ folder next to this file
# (icons/nas.svg -> icon = "nas"). Everything else is fetched once and cached.

# Friendly links: "ip:port" of a discovered service -> URL on its card.
# [links]
# "192.168.1.20:8989" = "http://sonarr.lan"

# [[bookmark]]
# group = "Admin"
# name = "Router"
# abbr = "GW"
# url = "https://192.168.1.1"

# Your own panels: put custom.css / custom.js next to this file. Sett serves
# them and gives custom.js an empty <div id="panels"> it never re-renders, plus a
# "sett:render" event (detail = the state) after every refresh.
